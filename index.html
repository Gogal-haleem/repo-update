<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper seciors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="head">Rock Paper Seciors</h1>
    
    <div class="choices">
        <div class="choice" id="rock">
            <img src="./download (3).png" alt="rock" height="100">
        </div>
        <div class="choice" id="paper">
            <img src="./image2.png" alt="paper" height="100">
        </div>
        <div class="choice" id="scissors">
            <img src="./image.jpg" alt="scissors" height="100">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Oponent</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>

    <script src="1st.js"></script>
</body>
</html>
